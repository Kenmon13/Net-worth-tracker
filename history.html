<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Net Worth History</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 24px;
  }
  h1 { margin: 0 0 8px; }
  .subtitle { color: #94a3b8; margin-bottom: 24px; }
  .container { max-width: 1200px; margin: 0 auto; }
  nav { margin-bottom: 24px; display: flex; gap: 12px; }
  nav a {
    color: #a5b4fc;
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid #334155;
    font-size: 14px;
  }
  nav a:hover { background: #1e293b; }
  nav a.active { background: #6366f1; color: white; border-color: #6366f1; }

  .snapshot-form {
    background: linear-gradient(135deg, #1e40af, #7c3aed);
    padding: 24px;
    border-radius: 12px;
    margin-bottom: 24px;
  }
  .form-top {
    display: flex;
    gap: 16px;
    align-items: flex-end;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: #cbd5e1; text-transform: uppercase; }
  .field input {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.2);
    color: #e2e8f0;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 14px;
    width: 130px;
  }
  .field input:focus { outline: none; border-color: #a5b4fc; }
  .field input[type="date"] { width: 160px; }

  .breakdown-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px;
  }
  .breakdown-grid .field input { width: 100%; }

  button {
    background: #6366f1;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }
  button:hover { background: #4f46e5; }

  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #334155;
    margin-bottom: 20px;
  }
  .card h2 { margin: 0 0 16px; font-size: 18px; }

  .chart-container {
    width: 100%;
    height: 300px;
    position: relative;
  }
  canvas { width: 100%; height: 100%; }

  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    white-space: nowrap;
  }
  th {
    text-align: right;
    padding: 10px 10px;
    border-bottom: 2px solid #334155;
    color: #94a3b8;
    font-size: 11px;
    text-transform: uppercase;
  }
  th:first-child { text-align: left; }
  td {
    padding: 10px 10px;
    border-bottom: 1px solid #1e293b;
    text-align: right;
  }
  td:first-child { text-align: left; }
  tr:hover td { background: #0f172a; }
  .change-pos { color: #22c55e; }
  .change-neg { color: #ef4444; }
  .col-total { font-weight: 700; }
  .col-liab { color: #ef4444; }
  .btn-del {
    background: #7f1d1d;
    padding: 4px 10px;
    font-size: 12px;
  }
  .btn-del:hover { background: #991b1b; }
  .empty-state {
    color: #94a3b8;
    text-align: center;
    padding: 40px 20px;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 16px;
  }
  .stat-card .label { font-size: 12px; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
  .stat-card .value { font-size: 24px; font-weight: 700; }

  .preview-total {
    font-size: 22px;
    font-weight: 700;
    align-self: center;
    padding: 0 8px;
    min-width: 140px;
  }
</style>
</head>
<body>
<div class="container">
  <nav>
    <a href="index.html">Tracker</a>
    <a href="history.html" class="active">History</a>
  </nav>

  <h1>Net Worth History</h1>
  <div class="subtitle">Track your net worth over time with full breakdown</div>

  <div class="snapshot-form">
    <div class="form-top">
      <div class="field">
        <label>Date</label>
        <input type="date" id="snapshot-date" />
      </div>
      <button onclick="loadFromTracker()">Load from Tracker</button>
      <button onclick="saveSnapshot()">Save Snapshot</button>
      <div class="preview-total" id="preview-total">$0.00</div>
    </div>
    <div class="breakdown-grid">
      <div class="field">
        <label>Stocks</label>
        <input type="number" step="0.01" id="f-stocks" value="0" oninput="updatePreview()" />
      </div>
      <div class="field">
        <label>Bonds</label>
        <input type="number" step="0.01" id="f-bonds" value="0" oninput="updatePreview()" />
      </div>
      <div class="field">
        <label>Cash</label>
        <input type="number" step="0.01" id="f-cash" value="0" oninput="updatePreview()" />
      </div>
      <div class="field">
        <label>CPF</label>
        <input type="number" step="0.01" id="f-cpf" value="0" oninput="updatePreview()" />
      </div>
      <div class="field">
        <label>Other</label>
        <input type="number" step="0.01" id="f-other" value="0" oninput="updatePreview()" />
      </div>
      <div class="field">
        <label>Liabilities</label>
        <input type="number" step="0.01" id="f-liab" value="0" oninput="updatePreview()" />
      </div>
    </div>
  </div>

  <div class="stats-row" id="stats-row"></div>

  <div class="card">
    <h2>Net Worth Over Time</h2>
    <div class="chart-container">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>Snapshot History</h2>
    <div class="table-wrap" id="history-table"></div>
  </div>
</div>

<script>
const HISTORY_STORAGE = "networth_history_v1";
const TRACKER_STORAGE = "networth_v1";
const CATEGORIES = ["stocks","bonds","cash","cpf","other","liab"];

let snapshots = loadHistory();

function loadHistory() {
  try {
    const raw = JSON.parse(localStorage.getItem(HISTORY_STORAGE)) || [];
    // Migrate old format (just {date, value}) to new format with breakdown
    return raw.map(h => {
      if (h.stocks !== undefined) return h; // already new format
      return { date: h.date, stocks: 0, bonds: 0, cash: 0, cpf: 0, other: 0, liab: 0, total: h.value || 0 };
    });
  } catch { return []; }
}

function saveSnapshots() {
  localStorage.setItem(HISTORY_STORAGE, JSON.stringify(snapshots));
  render();
}

function fmt(n) {
  return "$" + (Number(n)||0).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
}

function getTotal(s) {
  return (s.stocks||0) + (s.bonds||0) + (s.cash||0) + (s.cpf||0) + (s.other||0) - (s.liab||0);
}

function getFormValues() {
  const v = {};
  CATEGORIES.forEach(c => v[c] = parseFloat(document.getElementById("f-" + c).value) || 0);
  v.total = getTotal(v);
  return v;
}

function updatePreview() {
  const v = getFormValues();
  document.getElementById("preview-total").textContent = fmt(v.total);
}

function getTrackerBreakdown() {
  try {
    const data = JSON.parse(localStorage.getItem(TRACKER_STORAGE));
    if (!data) return null;

    let stocks = 0;
    (data.stocks || []).forEach(s => stocks += (s.shares||0) * (s.price||0));

    const sumList = (list) => (list || []).reduce((t, item) => t + (Number(item.value)||0), 0);

    const cpfData = data.cpf || {oa:0, sa:0, ma:0};

    return {
      stocks,
      bonds: sumList(data.bonds),
      cash: sumList(data.cash),
      cpf: (cpfData.oa||0) + (cpfData.sa||0) + (cpfData.ma||0),
      other: sumList(data.other),
      liab: sumList(data.liab)
    };
  } catch { return null; }
}

function loadFromTracker() {
  const breakdown = getTrackerBreakdown();
  if (!breakdown) {
    alert("No data found in the tracker. Go to the Tracker page and add some assets first.");
    return;
  }
  CATEGORIES.forEach(c => {
    document.getElementById("f-" + c).value = breakdown[c].toFixed(2);
  });
  updatePreview();
}

function saveSnapshot() {
  const date = document.getElementById("snapshot-date").value;
  if (!date) { alert("Please select a date."); return; }

  const v = getFormValues();
  const entry = { date, ...v };

  const existing = snapshots.findIndex(h => h.date === date);
  if (existing >= 0) {
    if (!confirm(`A snapshot for ${date} already exists (${fmt(snapshots[existing].total)}). Replace it?`)) return;
    snapshots[existing] = entry;
  } else {
    snapshots.push(entry);
  }

  snapshots.sort((a, b) => a.date.localeCompare(b.date));
  saveSnapshots();
}

function deleteSnapshot(index) {
  if (!confirm(`Delete snapshot for ${snapshots[index].date}?`)) return;
  snapshots.splice(index, 1);
  saveSnapshots();
}

function render() {
  renderStats();
  renderChart();
  renderTable();
}

function renderStats() {
  const el = document.getElementById("stats-row");
  if (snapshots.length === 0) { el.innerHTML = ""; return; }

  const latest = snapshots[snapshots.length - 1];
  const first = snapshots[0];
  const allTimeChange = latest.total - first.total;
  const allTimePct = first.total !== 0 ? (allTimeChange / Math.abs(first.total)) * 100 : 0;

  let lastChange = null;
  let lastPct = null;
  if (snapshots.length >= 2) {
    const prev = snapshots[snapshots.length - 2];
    lastChange = latest.total - prev.total;
    lastPct = prev.total !== 0 ? (lastChange / Math.abs(prev.total)) * 100 : 0;
  }

  const cls = (v) => v >= 0 ? "change-pos" : "change-neg";
  const sign = (v) => v >= 0 ? "+" : "";

  el.innerHTML = `
    <div class="stat-card">
      <div class="label">Latest Net Worth</div>
      <div class="value">${fmt(latest.total)}</div>
      <div style="font-size:12px; color:#94a3b8; margin-top:4px;">${latest.date}</div>
    </div>
    <div class="stat-card">
      <div class="label">All-Time Change</div>
      <div class="value ${cls(allTimeChange)}">${sign(allTimeChange)}${fmt(Math.abs(allTimeChange))}</div>
      <div style="font-size:12px; margin-top:4px;" class="${cls(allTimeChange)}">${sign(allTimeChange)}${Math.abs(allTimePct).toFixed(2)}% since ${first.date}</div>
    </div>
    ${lastChange !== null ? `
    <div class="stat-card">
      <div class="label">Last Change</div>
      <div class="value ${cls(lastChange)}">${sign(lastChange)}${fmt(Math.abs(lastChange))}</div>
      <div style="font-size:12px; margin-top:4px;" class="${cls(lastChange)}">${sign(lastChange)}${Math.abs(lastPct).toFixed(2)}%</div>
    </div>` : ""}
    <div class="stat-card">
      <div class="label">Snapshots</div>
      <div class="value">${snapshots.length}</div>
      <div style="font-size:12px; color:#94a3b8; margin-top:4px;">${first.date} — ${latest.date}</div>
    </div>
  `;
}

function renderChart() {
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + "px";
  canvas.style.height = rect.height + "px";
  ctx.scale(dpr, dpr);

  const W = rect.width;
  const H = rect.height;
  const pad = { top: 20, right: 20, bottom: 50, left: 80 };

  ctx.clearRect(0, 0, W, H);

  if (snapshots.length === 0) {
    ctx.fillStyle = "#94a3b8";
    ctx.font = "14px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("No snapshots yet. Save your first snapshot above.", W/2, H/2);
    return;
  }

  const values = snapshots.map(h => h.total);
  const minVal = Math.min(...values);
  const maxVal = Math.max(...values);
  const range = maxVal - minVal || 1;
  const yPad = range * 0.1;

  const chartW = W - pad.left - pad.right;
  const chartH = H - pad.top - pad.bottom;

  const xStep = snapshots.length > 1 ? chartW / (snapshots.length - 1) : 0;

  const toX = (i) => pad.left + i * xStep;
  const toY = (v) => pad.top + chartH - ((v - (minVal - yPad)) / (range + 2 * yPad)) * chartH;

  // Grid lines
  ctx.strokeStyle = "#334155";
  ctx.lineWidth = 0.5;
  const gridLines = 5;
  for (let i = 0; i <= gridLines; i++) {
    const v = (minVal - yPad) + (range + 2 * yPad) * (i / gridLines);
    const y = toY(v);
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(W - pad.right, y);
    ctx.stroke();

    ctx.fillStyle = "#94a3b8";
    ctx.font = "11px -apple-system, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(fmt(v), pad.left - 8, y + 4);
  }

  // Area fill
  if (snapshots.length > 1) {
    const gradient = ctx.createLinearGradient(0, pad.top, 0, pad.top + chartH);
    gradient.addColorStop(0, "rgba(99, 102, 241, 0.3)");
    gradient.addColorStop(1, "rgba(99, 102, 241, 0.02)");

    ctx.beginPath();
    ctx.moveTo(toX(0), pad.top + chartH);
    snapshots.forEach((h, i) => ctx.lineTo(toX(i), toY(h.total)));
    ctx.lineTo(toX(snapshots.length - 1), pad.top + chartH);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();
  }

  // Line
  ctx.beginPath();
  ctx.strokeStyle = "#6366f1";
  ctx.lineWidth = 2.5;
  ctx.lineJoin = "round";
  snapshots.forEach((h, i) => {
    if (i === 0) ctx.moveTo(toX(i), toY(h.total));
    else ctx.lineTo(toX(i), toY(h.total));
  });
  ctx.stroke();

  // Points
  snapshots.forEach((h, i) => {
    ctx.beginPath();
    ctx.arc(toX(i), toY(h.total), 4, 0, Math.PI * 2);
    ctx.fillStyle = "#6366f1";
    ctx.fill();
    ctx.strokeStyle = "#e2e8f0";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  // X labels
  ctx.fillStyle = "#94a3b8";
  ctx.font = "11px -apple-system, sans-serif";
  ctx.textAlign = "center";

  const maxLabels = Math.floor(chartW / 80);
  const step = Math.max(1, Math.ceil(snapshots.length / maxLabels));

  snapshots.forEach((h, i) => {
    if (i % step === 0 || i === snapshots.length - 1) {
      const parts = h.date.split("-");
      const label = `${parts[1]}/${parts[2]}`;
      ctx.save();
      ctx.translate(toX(i), H - pad.bottom + 16);
      ctx.rotate(-0.4);
      ctx.fillText(label, 0, 0);
      ctx.restore();

      if (i === 0 || h.date.slice(0,4) !== snapshots[i-1]?.date.slice(0,4)) {
        ctx.save();
        ctx.translate(toX(i), H - pad.bottom + 32);
        ctx.rotate(-0.4);
        ctx.fillText(parts[0], 0, 0);
        ctx.restore();
      }
    }
  });
}

function renderTable() {
  const el = document.getElementById("history-table");

  if (snapshots.length === 0) {
    el.innerHTML = `<div class="empty-state">No snapshots yet. Use the form above to save your first net worth snapshot.</div>`;
    return;
  }

  const reversed = [...snapshots].reverse();

  let html = `<table>
    <thead><tr>
      <th>Date</th>
      <th>Stocks</th>
      <th>Bonds</th>
      <th>Cash</th>
      <th>CPF</th>
      <th>Other</th>
      <th>Liabilities</th>
      <th>Net Worth</th>
      <th>Change</th>
      <th></th>
    </tr></thead>
    <tbody>`;

  reversed.forEach((h, ri) => {
    const origIdx = snapshots.length - 1 - ri;
    const prev = origIdx > 0 ? snapshots[origIdx - 1] : null;
    let changeHtml = "—";

    if (prev) {
      const change = h.total - prev.total;
      const pct = prev.total !== 0 ? (change / Math.abs(prev.total)) * 100 : 0;
      const c = change >= 0 ? "change-pos" : "change-neg";
      const s = change >= 0 ? "+" : "";
      changeHtml = `<span class="${c}">${s}${fmt(Math.abs(change))}<br><small>${s}${Math.abs(pct).toFixed(2)}%</small></span>`;
    }

    html += `<tr>
      <td>${h.date}</td>
      <td>${fmt(h.stocks)}</td>
      <td>${fmt(h.bonds)}</td>
      <td>${fmt(h.cash)}</td>
      <td>${fmt(h.cpf)}</td>
      <td>${fmt(h.other)}</td>
      <td class="col-liab">${h.liab ? "-" + fmt(h.liab) : fmt(0)}</td>
      <td class="col-total">${fmt(h.total)}</td>
      <td>${changeHtml}</td>
      <td><button class="btn-del" onclick="deleteSnapshot(${origIdx})">Del</button></td>
    </tr>`;
  });

  html += `</tbody></table>`;
  el.innerHTML = html;
}

// Set default date to today
document.getElementById("snapshot-date").value = new Date().toISOString().slice(0, 10);

// Auto-load tracker data into form on page load
const initBreakdown = getTrackerBreakdown();
if (initBreakdown) {
  CATEGORIES.forEach(c => {
    document.getElementById("f-" + c).value = initBreakdown[c].toFixed(2);
  });
}
updatePreview();

window.addEventListener("resize", () => renderChart());
render();
</script>
</body>
</html>
